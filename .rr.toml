# This repository's profile, merged over rr's built-in rr.toml defaults.

[verify]
# Markdown and Python/Rust comments: the decision records under docs/td, the
# use cases, the gate and benchmark notes, and the markers code and the scripts
# that measure it carry to cite them.
in-scope = ["**/*.md", "**/*.py", "**/*.rs"]
# Model directories and replay audio, when they are ever checked in, are
# fixtures, not prose.
exclude = ["tests/data/**", "target/**"]
rules = [
  "malformed-marker",
  "dangling-marker",
  "ambiguous-marker",
  "path-only-marker",
]

[scan.python]
eligible = ["comments"]

[scan.rust]
eligible = ["comments"]
