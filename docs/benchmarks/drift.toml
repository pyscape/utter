# ------------------------------------------------------------ sound-rating

[[rule]]
page = "sound-rating"
path = ["result", "words", "separation", "energy over floor", "**"]
kind = "oracle"
note = "the comparator; computed from the audio, not the decoder"

[[rule]]
page = "sound-rating"
path = ["result", "words", "separation", "**", "threshold*"]
kind = "ignore"

[[rule]]
page = "sound-rating"
path = ["result", "words", "separation", "certainty", "auc_*"]
better = "up"
tol = 0.002
weight = 6

[[rule]]
page = "sound-rating"
path = ["result", "words", "separation", "*", "spoken_kept"]
better = "up"
tol = 0.005
weight = 6

[[rule]]
page = "sound-rating"
path = ["result", "words", "separation", "*", "room_rejected"]
better = "up"
tol = 0.005
weight = 6

[[rule]]
page = "sound-rating"
path = ["result", "level", "grammars", "*", "p90_abs_change"]
better = "down"
tol = 0.001
weight = 5

[[rule]]
page = "sound-rating"
path = ["result", "level", "gains", "*", "p90_abs_change"]
better = "down"
tol = 0.02
weight = 5

[[rule]]
page = "sound-rating"
path = ["result", "sounds", "per_event", "*", "*", "rule", "*"]
