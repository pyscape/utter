# What a drift between two runs of the benchmark pages costs, per figure.
#
# The comparison tool flattens each page's <page>.json to paths (a list
# element's segment is its index) and gives every numeric figure the first
# rule below whose page and path match. A path pattern is one glob per
# segment; "**" spans any number of segments, and {a,b} is any of a and b.
#
# kind
#   exact   decoded output, deterministic: any change is real
#   timing  compute; compared only between runs made in the same session,
#           and only the part of a slip beyond the runs' own spread counts
#   oracle  libvosk's or another reference engine's figure, which utter
#           cannot move; a change means the inputs or the harness changed
#   input   the size or setting of what was run; a change makes the page
#           not comparable
#   ignore  p-values, fitted thresholds, bootstrap bounds, wall clocks
#
# better    "up", "down", or "either" when any move is a slip
# tol       one unit of slip, in the figure's own unit; rel is a fraction
#           of the baseline figure instead
# weight    how much one unit of slip matters; severity = weight * slip / tol
# line      a slip that ranks above every severity: "any" worsening at all,
#           "noise" for timing worse than the spread, or a bound the
#           figure must stay on the right side of
#
# Report order: pages not comparable (an input or oracle moved), lines
# crossed, the rest by severity, then improvements. Rows matched by the
# same rule fold under the worst of them.
#
# bench_compare.py check holds this file to the pages: every section a page
# writes is listed under [sections], every figure has a rule of its own
# rather than [defaults], every exact or timing rule names its section, and
# every rule matches a figure. run --publish checks before and after.

[defaults]
kind = "exact"
better = "either"
rel = 0.10
weight = 1

[baseline]
default = "v0.0.4"
speaker-evidence = "v0.0.5"
sound-rating = "v0.0.6"

# A section is a page's top-level key, or the key under "result" where a page
# nests its figures there.
[sections]
speech-commands = [
  "clips",
  "block_ms",
  "grammar_size",
  "preflight",
