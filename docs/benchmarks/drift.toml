path = ["{A5,A5_bound}", "**"]
tol = 5
weight = 2

[[rule]]
page = "partial-states"
path = ["parity", "*"]
better = "either"
tol = 50
weight = 3

[[rule]]
page = "partial-states"
path = ["wordless", "**"]
better = "down"
tol = 2
weight = 4

[[rule]]
page = "partial-states"
path = [
  "{fit,A1,A2,A2_lead_ms,A2_mcnemar,A3,A4,A4_by_pause,B1,B2,B2_advances,B2_by_lead,B3,B4,B5,B_mcnemar,B_mcnemar_gaining,B_gaining,B_call_ms,C1_momentum,C2_silence,C3_aligned,C3_crossing,C5_onset,C4_reversal}",
  "**",
]
tol = 5
weight = 1
note = "the exploratory sections; any move shows, none ranks high"

# ------------------------------------------------------------ quiet-onsets

[[rule]]
page = "quiet-onsets"
path = ["sweep", "*", "{level,streams}"]
kind = "input"

[[rule]]
page = "quiet-onsets"
path = ["sweep", "*", "per_engine", "*", "{words,pauses,finishes}"]
kind = "input"

[[rule]]
page = "quiet-onsets"
path = ["sweep", "*", "per_engine", "*", "{lost,cut}"]
better = "down"
tol = 2
weight = 6

[[rule]]
page = "quiet-onsets"
path = ["sweep", "*", "per_engine", "*", "right"]
better = "up"
tol = 2
weight = 6

[[rule]]
page = "quiet-onsets"
path = ["sweep", "*", "per_engine", "*", "*"]
better = "down"
tol = 2
weight = 4
note = "restarted, misread, gained, late, floor_finals, pauses_ended, finishes_called, finals"

