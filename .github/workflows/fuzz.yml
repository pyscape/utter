name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a long run has a chance at what a minute of fuzzing does not reach.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [kaldi_reader, fst_reader, json_array, transition_model, ivector, audio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: cargo-fuzz
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      # The audio target needs a model directory and returns without one, so it is built and
      # run here for the build alone.
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          seconds=60
          if [ "${{ github.event_name }}" = "schedule" ]; then
            seconds=1200
          fi
          cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="$seconds"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
