name: CI

on:
  push:
    branches: [main, pre-alpha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff && ruff check scripts && ruff format --check scripts

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The crate has no dependencies
        shell: bash
        run: |
          test "$(grep -c '^name = ' Cargo.lock)" = "1"
      - run: cargo build --release --all-targets
      - run: cargo test --release
      - run: cargo build --release --lib
      - name: Shared library and header exist
        shell: bash
        run: |
          ls target/release/ | grep -i -E "utter\.(so|dll|dylib)"
          test -f include/utter.h

  model-tests:
    # Integration tests against the stock small English model, and line coverage over unit and
    # model tests together. The model zip is cached between runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v4
        id: model
        with:
          path: models/vosk-model-small-en-us-0.15
          key: vosk-model-small-en-us-0.15
      - name: Download the stock model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sfL -o models/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q models/model.zip -d models
          rm models/model.zip
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Tests with coverage
        env:
          UTTER_TEST_MODEL: ${{ github.workspace }}/models/vosk-model-small-en-us-0.15
        run: |
          cargo llvm-cov --release --lcov --output-path lcov.info --fail-under-lines 60
          cargo llvm-cov report --release --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov
