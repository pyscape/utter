name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  libraries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The Linux libraries are linked against glibc 2.28, the floor the utterpy wheel has
          # through manylinux_2_28, so RHEL 8, Ubuntu 20.04 and Debian 11 load them; the runner's
          # own glibc would set the floor at 2.34.
          - os: ubuntu-latest
            glibc_target: x86_64-unknown-linux-gnu
            lib: target/x86_64-unknown-linux-gnu/release/libutter.so
            name: utter-linux-x86_64
          - os: ubuntu-24.04-arm
            glibc_target: aarch64-unknown-linux-gnu
            lib: target/aarch64-unknown-linux-gnu/release/libutter.so
            name: utter-linux-aarch64
          - os: windows-latest
            lib: target/release/utter.dll
            name: utter-windows-x86_64
          - os: windows-11-arm
            lib: target/release/utter.dll
            name: utter-windows-arm64
          # The macOS entries run the tests on each architecture; the universal job below
          # ships one library for both. An unset flag compares equal to false in a workflow
          # expression, so the entries that do ship carry no flag and the gate negates it.
          - os: macos-latest
            lib: target/release/libutter.dylib
            name: utter-macos-arm64
            test_only: true
          - os: macos-15-intel
            lib: target/release/libutter.dylib
            name: utter-macos-x86_64
            test_only: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: rustup toolchain install
      - name: The tag is the manifest's version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: cargo test --release
      - if: "!matrix.test_only && !matrix.glibc_target"
        run: cargo build --release --lib --bin stream
      - if: matrix.glibc_target
        run: |
          pip install --require-hashes -r .github/requirements/release.txt
          cargo zigbuild --release --lib --bin stream --target "${{ matrix.glibc_target }}.2.28"
          for b in "${{ matrix.lib }}" "target/${{ matrix.glibc_target }}/release/stream"; do
            strip --strip-debug "$b"
            need=$(objdump -T "$b" | grep -oE 'GLIBC_[0-9.]+' | sort -t. -k2,2n -k3,3n | tail -1)
            echo "$b needs $need"
            test "$need" = GLIBC_2.28
          done
      - if: "!matrix.test_only"
        shell: bash
        env:
          BUILD_DIR: target/${{ matrix.glibc_target && format('{0}/', matrix.glibc_target) || '' }}release
        run: |
          mkdir "${{ matrix.name }}"
          cp "${{ matrix.lib }}" include/utter.h LICENSE "${{ matrix.name }}/"
          cp "$BUILD_DIR"/stream${{ runner.os == 'Windows' && '.exe' || '' }} "${{ matrix.name }}/"
          cp third_party/Vosk-Rust/LICENSE "${{ matrix.name }}/LICENSE-Apache-2.0"
          cp third_party/Vosk-Rust/NOTICE "${{ matrix.name }}/NOTICE"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -bso0 "${{ matrix.name }}.zip" "${{ matrix.name }}"
          else
            tar -czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          fi
      - if: "!matrix.test_only"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
          if-no-files-found: error

  macos-universal:
    # One library and one stream tool for both Mac architectures, signed ad hoc: Apple Silicon
    # loads no unsigned code at all, and without a paid Developer ID an ad-hoc signature is the
    # most a download can carry. Gatekeeper still quarantines a browser download; the README's
    # C section gives the xattr line that clears it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: rustup toolchain install && rustup target add x86_64-apple-darwin
      - run: |
          cargo build --release --lib --bin stream --target aarch64-apple-darwin
          cargo build --release --lib --bin stream --target x86_64-apple-darwin
      - run: |
          mkdir utter-macos-universal
          for f in libutter.dylib stream; do
            lipo -create -output "utter-macos-universal/$f" \
              "target/aarch64-apple-darwin/release/$f" "target/x86_64-apple-darwin/release/$f"
            codesign --sign - --force --timestamp=none "utter-macos-universal/$f"
            codesign --verify --verbose "utter-macos-universal/$f"
            lipo -info "utter-macos-universal/$f"
          done
          cp include/utter.h LICENSE utter-macos-universal/
          cp third_party/Vosk-Rust/LICENSE utter-macos-universal/LICENSE-Apache-2.0
          cp third_party/Vosk-Rust/NOTICE utter-macos-universal/NOTICE
          tar -czf utter-macos-universal.tar.gz utter-macos-universal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: utter-macos-universal
          path: utter-macos-universal.tar.gz

  publish:
    # crates.io trusted publishing: the crate on crates.io names this repository and workflow as
    # its publisher, and the action trades the job's OIDC token for a short-lived registry token.
    needs: [libraries, macos-universal]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: rustup toolchain install
      - name: Whether crates.io already has this version (the first release of a crate is
          published by hand, before a trusted publisher can be attached to it)
        id: registry
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "utter release workflow" \
            "https://crates.io/api/v1/crates/utter/${GITHUB_REF_NAME#v}")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.registry.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth
      - if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Provenance for every archive, verifiable with `gh attestation verify`
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      # The attestation lives in the repository's attestation store, which is what `gh attestation
      # verify` reads. Its Sigstore bundle also rides with the release so that a consumer without
      # GitHub access can verify offline with --bundle, and so that tooling that only reads asset
      # names (OpenSSF Scorecard's Signed-Releases) sees the release as signed; the bundle's DSSE
      # envelope, the signed in-toto SLSA statement itself, rides beside it under the name that
      # tooling reads as provenance. One attestation names every archive as a subject; the action
      # would write one bundle per line if it made several, so the copy is guarded against that.
      - name: The Sigstore bundle and its provenance envelope beside the archives
        run: |
          test "$(jq -c . "${{ steps.attest.outputs.bundle-path }}" | wc -l)" = 1
          jq . "${{ steps.attest.outputs.bundle-path }}" > "dist/utter-${GITHUB_REF_NAME}.sigstore.json"
          jq -c .dsseEnvelope "${{ steps.attest.outputs.bundle-path }}" > "dist/utter-${GITHUB_REF_NAME}.intoto.jsonl"
          ls -l dist
      - name: GitHub release with the shared libraries and header attached
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/*
          body_path: docs/release-notes/${{ github.ref_name }}.md
