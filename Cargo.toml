[package]
name = "utter"
version = "0.0.1"
edition = "2021"
license = "MIT AND Apache-2.0"
description = "Pure-Rust streaming decoder for Vosk models: partials, alternatives, word intervals, endpointing"
repository = "https://github.com/pyscape/utter"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]

# On every target, unlike an attribute in lib.rs.
[lints.clippy]
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

[[bench]]
name = "kernels"
harness = false

[profile.release]
opt-level = 3
debug = 1
